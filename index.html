<!doctype html>
<html lang="fa" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./CSS/variables.css" />
    <link rel="stylesheet" href="./CSS/base.css" />
    <link rel="stylesheet" href="./CSS/layout.css" />
    <link rel="stylesheet" href="./CSS/components.css" />
    <link rel="shortcut icon" href="./Images/crowtus.svg" type="image/x-icon" />
    <script defer src="./JS/lucide.min.js"></script>
    <script defer src="./JS/app.js"></script>
    <title>Marco</title>
  </head>
  <body>
    <div class="login">
      <img class="login__img" src="/Images/login.png" alt="login image" />
      <form action="" class="login__form">
        <h1>Welcome to <span class="text--primary">Marco</span></h1>
        <div class="input input--lg">
          <label class="input__label" for="phone"
            >Enter Your Phone Number:</label
          >
          <div class="input__wrapper">
            <select class="dropdown" name="countrycode" id="countrycode">
              <option value="" disabled selected>IRI</option>
            </select>
            <input
              class="input__field"
              type="tel"
              name="phone"
              id="phone"
              placeholder="9121234567"
              autocomplete="mobile"
            />
          </div>
        </div>
        <a class="btn btn--primary btn--lg btn--fill" href="http://"
          >Get Verification Code</a
        >
        <a
          class="btn btn--tertiary btn--lg btn--fill"
          href="/HTML Pages/Home.html"
          >Login as Guest</a
        >
      </form>
    </div>
  </body>
</html>
