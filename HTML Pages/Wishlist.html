<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Main Page</title>
    <link rel="stylesheet" href="../CSS/variables.css" />
    <link rel="stylesheet" href="../CSS/base.css" />
    <link rel="stylesheet" href="../CSS/layout.css" />
    <link rel="stylesheet" href="../CSS/components.css" />
    <link
      rel="shortcut icon"
      href="../Images/crowtus.svg"
      type="image/x-icon"
    />
    <script defer src="../JS/app.js"></script>
    <script defer src="../JS/lucide.min.js"></script>
  </head>
  <body>
    <!-- Navbar -->
    <nav class="nav section">
      <ul class="nav__items container">
        <li>
          <a class="btn btn--tertiary btn--nav" href="./Chatbot.html">
            <span data-lucide="bot-message-square" aria-hidden="true"></span>
            <span class="text--sm">Chatbot</span>
          </a>
        </li>
        <li>
          <a
            class="btn btn--tertiary btn--nav btn--is-active"
            href="./Wishlist.html"
          >
            <span data-lucide="bookmark" aria-hidden="true"></span>
            <span class="text--sm">Wishlist</span>
          </a>
        </li>
        <li>
          <a
            class="btn btn--tertiary btn--nav"
            href="./Home.html"
            aria-current="page"
          >
            <span data-lucide="home" aria-hidden="true"></span>
            <span class="text--sm">Home</span>
          </a>
        </li>
        <li>
          <a class="btn btn--tertiary btn--nav" href="./Cart.html">
            <span data-lucide="shopping-cart" aria-hidden="true"></span>
            <span class="text--sm">Cart</span>
          </a>
        </li>
        <li>
          <a class="btn btn--tertiary btn--nav" href="./Explore.html">
            <span data-lucide="compass" aria-hidden="true"></span>
            <span class="text--sm">Explore</span>
          </a>
        </li>
      </ul>
    </nav>
    <!-- Header -->
    <header class="header section">
      <section class="header__title container">
        <button class="btn btn--tertiary btn--header" aria-label="Menu">
          <span data-lucide="menu"></span>
        </button>
        <div class="logo">
          <img src="../Images/logo/logo.svg" alt="" />
        </div>
        <button
          class="btn btn--tertiary btn--header"
          aria-label="Customer Service"
        >
          <span data-lucide="headset"></span>
        </button>
      </section>
    </header>
    <main>
      <section class="wishlist container">
        <ul class="wishlist__list container">
          <li class="wishlist__item">
            <a class="btn btn--secondary btn--nav" href="">
              <img
                class="wishlist__img"
                src="/Images/Stays/Stay No 1.webp"
                alt=""
              />
              <span>Stays</span></a
            >
          </li>
          <li class="wishlist__item">
            <a class="btn btn--secondary btn--nav" href="">
              <img
                class="wishlist__img"
                src="/Images/Events/Event No 6.webp"
                alt=""
              />
              <span>Events</span></a
            >
          </li>
          <li class="wishlist__item">
            <a class="btn btn--secondary btn--nav" href="">
              <span data-lucide="plus"> </span>
              New Collection</a
            >
          </li>
        </ul>
      </section>
    </main>
  </body>
</html>
